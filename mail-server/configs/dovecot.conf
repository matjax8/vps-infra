protocols = imap lmtp

mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
}

ssl = required
ssl_cert = </etc/letsencrypt/live/mail.mattjack.cloud/fullchain.pem
ssl_key  = </etc/letsencrypt/live/mail.mattjack.cloud/privkey.pem
ssl_min_protocol = TLSv1.2

auth_mechanisms = plain login

userdb {
  driver = passwd
}

passdb {
  driver = pam
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot-info.log
